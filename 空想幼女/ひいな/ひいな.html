// ------------------------------
// 選択肢を押したときの処理
// ------------------------------
function selectOption(group, num) {

  const data = options[group][num];

  // 画像変更
  document.getElementById("mainImg").src = data.img;

  // 文章変更
  document.getElementById("mainText").textContent = data.text;

  // 次のボタン生成
  const area = document.getElementById("menuArea");
  area.innerHTML = "";

  data.next.forEach(nextGroup => {
    const btn = document.createElement("button");
    btn.className = "game-btn";
    btn.textContent = nextGroup;
    btn.onclick = () => selectOption(nextGroup, 1); // 次の階層の「1」を押した扱い
    area.appendChild(btn);
  });
}

// 最初の選択肢を表示
function start() {
  const area = document.getElementById("menuArea");
  area.innerHTML = `
    <button class="game-btn" onclick="selectOption('default1',1)">こんにちは</button>
    <button class="game-btn" onclick="selectOption('default2',1)">いや、何でもないよ</button>
    <button class="game-btn" onclick="selectOption('default3',1)">見てただけでね</button>
  `;
}
